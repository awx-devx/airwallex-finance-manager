[project]
name = "finance-manager"
version = "0.1.0"
description = "Compute-first MCP tools for a Hermes + Airwallex finance manager (reference demo)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finance-manager = "finance_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
